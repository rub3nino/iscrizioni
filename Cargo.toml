[package]
name = "iscrizioni"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4"
anyhow = "1.0.104"
askama = "0.13"
axum = "0.8"
chrono = { version = "0.4.45", features = ["clock"] }
chrono-tz = "0.10"
dotenvy = "0.15"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "io-util", "sync", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
